name: Copilot CLI smoke test

on:
  workflow_dispatch:

permissions:
  contents: read
  copilot-requests: write

concurrency:
  group: copilot-smoke-${{ github.ref }}
  cancel-in-progress: false

jobs:
  authentication-smoke-test:
    name: Verify Copilot request without repository writes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require repository secret
        shell: bash
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
        run: |
          if [[ -z "${COPILOT_GITHUB_TOKEN}" ]]; then
            echo "::error::Missing repository secret COPILOT_GITHUB_TOKEN. Add it in Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "Required secret is present (value not displayed)."

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Copilot CLI
        run: npm install --global @github/copilot

      - name: Make one bounded, read-only AI request
        shell: bash
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
        run: |
          stderr_file="$(mktemp)"
          trap 'rm -f "$stderr_file"' EXIT
          set +e
          response="$(timeout 180s copilot -p "Respond with exactly this text and nothing else: AUTOPOIESIS_COPILOT_SMOKE_OK. Do not use tools, access files, or perform actions." -s --no-ask-user 2>"$stderr_file")"
          cli_status=$?
          set -e
          if [[ "$cli_status" -ne 0 ]]; then
            echo "::error::Copilot CLI request failed (exit $cli_status). Redacted diagnostic follows."
            python -c 'import os,pathlib,sys; s=pathlib.Path(sys.argv[1]).read_text(errors="replace"); print(s.replace(os.environ.get("COPILOT_GITHUB_TOKEN", ""), "[REDACTED]"))' "$stderr_file"
            exit "$cli_status"
          fi
          if [[ -z "${response//[[:space:]]/}" ]]; then
            echo "::error::Copilot CLI exited successfully but returned an empty response."
            exit 1
          fi
          response_bytes="$(printf '%s' "$response" | wc -c | tr -d '[:space:]')"
          echo "COPILOT_AUTHENTICATED_REQUEST_OK"
          echo "Copilot returned a non-empty response (${response_bytes} bytes); response text omitted from logs."
          {
            echo "COPILOT_AUTHENTICATED_REQUEST_OK"
            echo "Copilot returned a non-empty response (${response_bytes} bytes)."
          } >> "$GITHUB_STEP_SUMMARY"
