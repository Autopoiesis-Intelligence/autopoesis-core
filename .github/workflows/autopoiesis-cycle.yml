name: Autopoiesis scheduled cycle

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      bootstrap:
        description: "Initialize the queue only if this workflow has no prior successful snapshot"
        required: false
        type: boolean
        default: false

permissions:
  actions: read
  contents: read

concurrency:
  group: autopoiesis-cycle-main
  cancel-in-progress: false

jobs:
  cycle:
    if: ${{ github.repository == 'Autopoiesis-Intelligence/autopoiesis-core' && github.ref == 'refs/heads/main' && vars.AUTOPOIESIS_CYCLE_DISABLED != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Select and validate previous state, or explicitly bootstrap once
        id: state
        env:
          GH_TOKEN: ${{ github.token }}
          BOOTSTRAP: ${{ inputs.bootstrap || false }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/autopoiesis-cycle.yml/runs?branch=main&status=success&per_page=100" > .cycle-runs.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          payload = json.loads(Path(".cycle-runs.json").read_text())
          current = int(os.environ["GITHUB_RUN_ID"])
          runs = payload.get("workflow_runs")
          if not isinstance(runs, list):
              raise SystemExit("Refusing: workflow runs response has no workflow_runs list")
          prior = [r for r in runs if isinstance(r, dict) and r.get("id") != current
                   and r.get("head_branch") == "main" and r.get("conclusion") == "success"
                   and r.get("path", "").split("@", 1)[0] == ".github/workflows/autopoiesis-cycle.yml"]
          prior.sort(key=lambda r: (r.get("run_number", 0), r.get("id", 0)), reverse=True)
          bootstrap = os.environ.get("BOOTSTRAP", "false").lower() == "true"
          if prior and bootstrap:
              raise SystemExit("Refusing bootstrap: a prior successful cycle already exists")
          if not prior and not bootstrap:
              raise SystemExit("No successful prior snapshot; dispatch once with bootstrap=true")
          if prior:
              run = prior[0]
              if not isinstance(run.get("head_sha"), str) or len(run["head_sha"]) != 40:
                  raise SystemExit("Refusing: source run has no valid head SHA")
              Path(".cycle-source.json").write_text(json.dumps(run))
              print(f"source_run_id={run['id']}")
              with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                  f.write(f"source_run_id={run['id']}\n")
          else:
              print("Explicit one-time bootstrap accepted; no prior successful cycle exists.")
              with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                  f.write("source_run_id=bootstrap\n")
          PY
     - name: Download previous queue snapshot
        if: ${{ steps.state.outputs.source_run_id != 'bootstrap' }}
        uses: actions/download-artifact@v4
        with:
          name: autopoiesis-cycle-state
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.state.outputs.source_run_id }}
          path: .cycle-restore
      - name: Validate and install previous queue snapshot
        if: ${{ steps.state.outputs.source_run_id != 'bootstrap' }}
        env:
          SOURCE_RUN_ID: ${{ steps.state.outputs.source_run_id }}
          SOURCE_HEAD_SHA: ${{ steps.state.outputs.source_head_sha }}
        run: |
          python - <<'PY'
          import json, os, shutil
          from pathlib import Path
          from autopoesis.queue_snapshot import validate_queue_snapshot
          snapshot = Path(".cycle-restore/TASK_QUEUE.json")
          manifest = Path(".cycle-restore/QUEUE_SNAPSHOT_MANIFEST.json")
          result = validate_queue_snapshot(
              snapshot, manifest,
              source_run_id=os.environ["SOURCE_RUN_ID"],
              source_head_sha=os.environ["SOURCE_HEAD_SHA"],
              source_repository=os.environ["GITHUB_REPOSITORY"],
          )
          shutil.copyfile(snapshot, "TASK_QUEUE.json")
          from autopoesis.task_queue import load_queue
          if load_queue(Path("TASK_QUEUE.json")) != result["queue"]:
              raise SystemExit("Installed queue differs from validated snapshot")
          print(f"Restored validated queue SHA-256 {result['task_queue_sha256']}.")
          PY
      - name: Initialize the first queue (explicit bootstrap only)
        if: ${{ steps.state.outputs.source_run_id == 'bootstrap' }}
        run: |
          python - <<'PY'
          from pathlib import Path
          from autopoesis.task_queue import update_queue_file
          update_queue_file(Path("TASK_QUEUE.json"), [{
              "id": "CYCLE-BOOTSTRAP-VERIFY",
              "type": "verify_test_scaffold",
              "source": "autopoesis/orchestrator.py",
              "evidence": "Owner-authorized initial seed for the scheduled cycle; verifies the bounded runner path."
          }])
          print("Initialized one allowlisted verification task.")
          PY
      - name: Run exactly one bounded cycle
        id: cycle
        continue-on-error: true
        run: python -m autopoesis.orchestrator --queue TASK_QUEUE.json --owner github-actions --root . --disable-file .autopoiesis-cycle-disabled --budget-seconds 600 | tee CYCLE_RESULT.json
      - name: Create state manifest
        if: always() && hashFiles('TASK_QUEUE.json') != ''
        env:
          SOURCE_RUN_ID: ${{ github.run_id }}
          SOURCE_HEAD_SHA: ${{ github.sha }}
          SOURCE_REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from autopoesis.queue_snapshot import create_queue_snapshot_manifest
          manifest = create_queue_snapshot_manifest(
              Path("TASK_QUEUE.json"),
              source_run_id=os.environ["SOURCE_RUN_ID"],
              source_head_sha=os.environ["SOURCE_HEAD_SHA"],
              source_repository=os.environ["SOURCE_REPOSITORY"],
          )
          Path("QUEUE_SNAPSHOT_MANIFEST.json").write_text(json.dumps(manifest, indent=2, sort_keys=True) + "\n")
          PY
      - name: Persist next queue state
        if: always() && hashFiles('TASK_QUEUE.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: autopoiesis-cycle-state
          path: |
            TASK_QUEUE.json
            QUEUE_SNAPSHOT_MANIFEST.json
            CYCLE_RESULT.json
          if-no-files-found: error
          retention-days: 30
      - name: Propagate cycle refusal
        if: ${{ steps.cycle.outcome == 'failure' }}
        run: exit 1      - name: Verify source run and artifact
        if: ${{ steps.state.outputs.source_run_id != 'bootstrap' }}
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ steps.state.outputs.source_run_id }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}" > .cycle-source.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}/artifacts" > .cycle-artifacts.json
          python - <<'PY'
          import json, os, re
          from pathlib import Path
          run = json.loads(Path(".cycle-source.json").read_text())
          artifacts_payload = json.loads(Path(".cycle-artifacts.json").read_text())
          expected_repo = os.environ["GITHUB_REPOSITORY"]
          if run.get("conclusion") != "success" or run.get("head_branch") != "main":
              raise SystemExit("Refusing: previous run is not successful on main")
          if run.get("path", "").split("@", 1)[0] != ".github/workflows/autopoiesis-cycle.yml":
              raise SystemExit("Refusing: source run belongs to another workflow")
          if run.get("event") not in {"schedule", "workflow_dispatch"}:
              raise SystemExit("Refusing: source run has an unexpected event")
          repo = run.get("repository", {})
          if not isinstance(repo, dict) or repo.get("full_name") != expected_repo:
              raise SystemExit("Refusing: source run repository mismatch")
          sha = run.get("head_sha")
          if not isinstance(sha, str) or not re.fullmatch(r"[0-9a-f]{40}", sha):
              raise SystemExit("Refusing: source run SHA invalid")
          artifacts = artifacts_payload.get("artifacts")
          if not isinstance(artifacts, list):
              raise SystemExit("Refusing: artifacts response malformed")
          matches = [a for a in artifacts if isinstance(a, dict) and a.get("name") == "autopoiesis-cycle-state" and not a.get("expired", True)]
          if len(matches) != 1:
              raise SystemExit("Refusing: source must have exactly one unexpired state artifact")
          artifact = matches[0]
          binding = artifact.get("workflow_run")
          if not isinstance(binding, dict) or str(binding.get("id")) != str(run.get("id")) or binding.get("head_sha") != sha:
              raise SystemExit("Refusing: state artifact is not bound to source run and SHA")
          if not re.fullmatch(r"sha256:[0-9a-f]{64}", str(artifact.get("digest", ""))):
              raise SystemExit("Refusing: state artifact digest missing or invalid")
          Path("SOURCE_HEAD_SHA").write_text(sha)
          print(f"Verified source run {run['id']} at {sha}, artifact {artifact.get('id')}, digest {artifact['digest']}.")
          PY
          echo "source_head_sha=$(cat SOURCE_HEAD_SHA)" >> "$GITHUB_OUTPUT"

