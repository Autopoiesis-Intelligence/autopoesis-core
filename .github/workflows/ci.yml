name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      restore_run_id:
        description: "Optional prior successful CI run ID whose queue artifact should be restored"
        required: false
        type: string

permissions:
  actions: read
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate restore run ID
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.restore_run_id != '' }}
        env:
          RESTORE_RUN_ID: ${{ inputs.restore_run_id }}
        run: |
          if [[ ! "$RESTORE_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "restore_run_id must contain digits only" >&2
            exit 1
          fi
      - name: Verify restore source run
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.restore_run_id != '' }}
        env:
          RESTORE_RUN_ID: ${{ inputs.restore_run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$RESTORE_RUN_ID" == "$GITHUB_RUN_ID" ]]; then
            echo "Cannot restore an artifact from the current run" >&2
            exit 1
          fi
          source_run="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RESTORE_RUN_ID")"
          expected_workflow_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml" --jq '.id')"
          source_workflow_id="$(jq -r '.workflow_id // empty' <<<"$source_run")"
          source_status="$(jq -r '.status // empty' <<<"$source_run")"
          source_conclusion="$(jq -r '.conclusion // empty' <<<"$source_run")"
          source_repository="$(jq -r '.head_repository.full_name // empty' <<<"$source_run")"
          if [[ "$source_workflow_id" != "$expected_workflow_id" ]]; then
            echo "Restore source must come from this CI workflow" >&2
            exit 1
          fi
          if [[ "$source_status" != "completed" || "$source_conclusion" != "success" ]]; then
            echo "Restore source run must have completed successfully" >&2
            exit 1
          fi
          if [[ "$source_repository" != "$GITHUB_REPOSITORY" ]]; then
            echo "Restore source must originate from this repository, not a fork" >&2
            exit 1
          fi
      - name: Restore queue snapshot from a prior run
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.restore_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          name: autopoesis-core-results
          path: .
          run-id: ${{ inputs.restore_run_id }}
          github-token: ${{ github.token }}
      - name: Validate restored queue snapshot
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.restore_run_id != '' }}
        run: |
          if [[ ! -f TASK_QUEUE.json ]]; then
            echo "Restored artifact does not contain TASK_QUEUE.json" >&2
            exit 1
          fi
          python -c "from pathlib import Path; from autopoesis.task_queue import load_queue; load_queue(Path('TASK_QUEUE.json'))"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Run file-based tasks
        run: python run_tasks.py
      - name: Upload task results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autopoesis-core-results
          path: |
            RESULTS.json
            TASK_QUEUE.json
          if-no-files-found: warn
