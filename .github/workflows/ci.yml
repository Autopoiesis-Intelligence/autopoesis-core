name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      restore_run_id:
        description: "Digits only: run ID of a prior successful workflow run that contains the seeded DONE and verification probes. Leave blank for the seed run."
        required: false
        type: string
        default: ""
      seed_done_probe:
        description: "Seed a synthetic DONE queue item into this run's artifact for cross-run restore verification"
        required: false
        type: boolean
        default: false

permissions:
  actions: read
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify prior run succeeded
        if: ${{ inputs.restore_run_id != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RESTORE_RUN_ID: ${{ inputs.restore_run_id }}
        run: |
          if [[ ! "$RESTORE_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "Invalid restore_run_id: enter only the numeric ID of a prior successful seed run (digits only), not the field name or a URL. Leave blank when creating the seed run." >&2
            exit 1
          fi
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RESTORE_RUN_ID}" > .restore-run.json
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          run = json.loads(Path(".restore-run.json").read_text(encoding="utf-8"))
          requested_run_id = os.environ["RESTORE_RUN_ID"]
          if str(run.get("id", "")) != requested_run_id:
              raise SystemExit("Source run ID does not match restore_run_id")
          if run.get("conclusion") != "success":
              raise SystemExit(
                  f"Source run must have conclusion=success; got {run.get('conclusion')!r}"
              )
          if run.get("event") != "workflow_dispatch":
              raise SystemExit(
                  f"Source run must be an explicit workflow_dispatch seed run; got {run.get('event')!r}"
              )
          workflow_path = str(run.get("path", "")).split("@", 1)[0]
          if workflow_path != ".github/workflows/ci.yml":
              raise SystemExit(
                  f"Source run must use .github/workflows/ci.yml; got {run.get('path')!r}"
              )
          repository = run.get("repository", {}).get("full_name")
          if repository != os.environ["GITHUB_REPOSITORY"]:
              raise SystemExit("Source run belongs to a different repository")
          source_sha = run.get("head_sha")
          if (
              not isinstance(source_sha, str)
              or len(source_sha) != 40
              or any(char not in "0123456789abcdefABCDEF" for char in source_sha)
          ):
              raise SystemExit("Source run does not expose a valid 40-character hexadecimal head SHA")
          provenance = {
              "source_run_id": run.get("id"),
              "source_run_url": run.get("html_url"),
              "source_repository": repository,
              "source_workflow_path": workflow_path,
              "source_head_sha": source_sha,
              "source_conclusion": run.get("conclusion"),
          }
          Path("QUEUE_RESTORE_PROVENANCE.json").write_text(
              json.dumps(provenance, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(
              f"Verified source run {provenance['source_run_id']} "
              f"at SHA {source_sha}."
          )
          PY
      - name: Download prior queue snapshot
        if: ${{ inputs.restore_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          name: autopoesis-core-results
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.restore_run_id }}
          path: .queue-restore
      - name: Validate and install prior queue snapshot
        if: ${{ inputs.restore_run_id != '' }}
        run: |
          python - <<'PY'
          import shutil
          from pathlib import Path
          from autopoesis.task_queue import load_queue

          snapshot = Path(".queue-restore/TASK_QUEUE.json")
          if not snapshot.is_file():
              raise SystemExit("Requested artifact does not contain TASK_QUEUE.json")
          load_queue(snapshot)
          shutil.copyfile(snapshot, "TASK_QUEUE.json")
          load_queue(Path("TASK_QUEUE.json"))
          print("Prior task queue snapshot restored and validated.")
          PY
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Run file-based tasks
        run: python run_tasks.py
      - name: Seed synthetic DONE probe for cross-run verification
        if: ${{ inputs.seed_done_probe }}
        run: |
          python - <<'PY'
          from pathlib import Path
          from autopoesis.task_queue import (
              update_queue_file,
              record_outcome_file,
              record_verification_file,
          )

          queue_path = Path("TASK_QUEUE.json")
          probe = {
              "id": "CI-RESTORE-DONE-PROBE",
              "type": "test_probe",
              "source": ".github/workflows/ci.yml",
              "evidence": "explicit workflow_dispatch seed for cross-run snapshot verification",
              "description": "Synthetic verification item; not a production task.",
          }
          update_queue_file(queue_path, [probe])
          record_outcome_file(
              queue_path,
              probe["id"],
              "DONE",
              "synthetic CI fixture for cross-run restore verification",
          )
          record_verification_file(
              queue_path,
              "CI-RESTORE-VERIFICATION-PROBE",
              "PASS",
              "CI_SYNTHETIC_PERSISTENCE_PROBE",
              "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa",
          )
          print("Seeded synthetic DONE and verification-evidence probes into the artifact queue.")
          PY
      - name: Verify restored DONE probe when present
        if: ${{ inputs.restore_run_id != '' }}
        env:
          REQUIRE_RESTORE_PROBES: "true"
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from autopoesis.task_queue import load_queue

          queue = load_queue(Path("TASK_QUEUE.json"))
          probe = next(
              (item for item in queue["items"] if item.get("id") == "CI-RESTORE-DONE-PROBE"),
              None,
          )
          if probe is None:
              if os.environ.get("REQUIRE_RESTORE_PROBES", "false").lower() == "true":
                  raise SystemExit("Required synthetic DONE probe is missing from restored snapshot")
              print("No synthetic DONE probe in source snapshot; cross-run DONE check not exercised.")
          else:
              if probe.get("status") != "DONE":
                  raise SystemExit(
                      f"Restored DONE probe has unexpected status: {probe.get('status')!r}"
                  )
              matching_history = [
                  event for event in queue["history"]
                  if event.get("task_id") == "CI-RESTORE-DONE-PROBE"
                  and event.get("to") == "DONE"
              ]
              if not matching_history:
                  raise SystemExit("Restored DONE probe has no DONE transition in history")
              print("Synthetic DONE probe and its status history survived cross-run restore.")

          verification = next(
              (
                  event for event in queue["history"]
                  if event.get("event") == "VERIFICATION_RECORDED"
                  and event.get("task_id") == "CI-RESTORE-VERIFICATION-PROBE"
              ),
              None,
          )
          if verification is not None:
              expected = {
                  "verification_status": "PASS",
                  "verification_level": "CI_SYNTHETIC_PERSISTENCE_PROBE",
                  "artifact_sha256": "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa",
              }
              for key, value in expected.items():
                  if verification.get(key) != value:
                      raise SystemExit(
                          f"Restored verification evidence field {key!r} mismatch"
                      )
              print("Synthetic verification evidence and digest survived cross-run restore.")
          else:
              if os.environ.get("REQUIRE_RESTORE_PROBES", "false").lower() == "true":
                  raise SystemExit("Required synthetic verification evidence is missing from restored snapshot")
              print("No synthetic verification evidence in source snapshot; evidence restore check not exercised.")
          PY
      - name: Upload task results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autopoesis-core-results
          path: |
            RESULTS.json
            TASK_QUEUE.json
            QUEUE_RESTORE_PROVENANCE.json
          if-no-files-found: warn
