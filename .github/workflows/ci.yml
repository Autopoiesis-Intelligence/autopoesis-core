name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      restore_run_id:
        description: "Optional prior successful CI run ID whose queue artifact should be restored"
        required: false
        type: string

permissions:
  actions: read
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore queue snapshot from a prior run
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.restore_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          name: autopoesis-core-results
          path: .
          run-id: ${{ inputs.restore_run_id }}
          github-token: ${{ github.token }}
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Run file-based tasks
        run: python run_tasks.py
      - name: Upload task results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autopoesis-core-results
          path: |
            RESULTS.json
            TASK_QUEUE.json
          if-no-files-found: warn
